name: Desktop app

# Builds the Tauri desktop app for macOS and Windows on every push and pull request,
# uploads the results as workflow artifacts, and attaches them to a GitHub Release
# when a tag like v0.1.0 is pushed. The iOS app is built from Xcode, not here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Rust + frontend tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Protocol tests
        run: cargo test -p vq-protocol
      - name: Injector tests (vq-inject)
        run: cargo test -p vq-inject
      - name: Desktop core tests (debug, dev-tcp)
        run: cargo test -p vq-host-core --features dev-tcp
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Frontend tests and type check
        working-directory: desktop/app
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  windows-test:
    name: Windows injector tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-inject
      - name: Tests
        run: cargo test -p vq-inject
      - name: Clippy
        run: cargo clippy -p vq-inject --all-targets -- -D warnings

  # Drives real Notepad through SendInput/UIA. Needs an interactive desktop, which
  # hosted runners may not give reliably, so a failure here does not block.
  windows-integration:
    name: Windows integration (Notepad, non-blocking)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-inject
      - name: Notepad integration test
        run: cargo test -p vq-inject --features win-it -- --ignored --nocapture --test-threads=1

  build:
    name: Build (${{ matrix.name }})
    needs: [test, windows-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            artifact: Ventriloquist-macos-arm64
          - name: Windows (x64)
            os: windows-latest
            artifact: Ventriloquist-windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/app/package-lock.json
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Install frontend dependencies
        working-directory: desktop/app
        run: npm ci
      - name: Build app
        working-directory: desktop/app
        run: cargo tauri build

      - name: Package macOS app
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist-out
          ditto -c -k --keepParent target/release/bundle/macos/Ventriloquist.app dist-out/${{ matrix.artifact }}.zip
      - name: Package Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-out | Out-Null
          Copy-Item target/release/bundle/msi/*.msi dist-out/
          Copy-Item target/release/bundle/nsis/*.exe dist-out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist-out/*
          if-no-files-found: error

  release:
    name: Attach to GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
