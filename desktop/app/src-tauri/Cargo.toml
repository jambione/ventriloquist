[package]
name = "ventriloquist-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ventriloquist desktop app (Tauri v2)"
publish = false

[lib]
name = "ventriloquist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ventriloquist"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Default features only (BLE). Never enable `dev-tcp` here (D14).
vq-host-core = { path = "../../core" }
tauri = { version = "2.9", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tokio = { version = "1.45", features = ["time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
uuid = "1.11"
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde_json = "1"
vq-inject = { version = "0.1.0", path = "../../inject" }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
