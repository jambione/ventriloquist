[package]
name = "ventriloquist-desktop"
version = "0.3.0"
edition.workspace = true
license.workspace = true
description = "Ventriloquist desktop app (Tauri v2)"
publish = false

[lib]
name = "ventriloquist_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ventriloquist"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Default features only (relay transport). Never enable `dev-tcp` here (D14).
vq-host-core = { path = "../../core" }
tauri = { version = "2.9", features = [] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.4"
tauri-plugin-clipboard-manager = "2.3"
tokio = { version = "1.45", features = ["time", "sync"] }
serde = { version = "1.0", features = ["derive"] }
uuid = "1.11"
log = "0.4"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde_json = "1"
vq-inject = { version = "0.1.0", path = "../../inject" }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
rand = "0.8"
base64 = "0.22"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Owner token in the OS secret store (macOS Keychain, Windows Credential
# Manager); a 0600 file in the config directory is the fallback.
keyring = { version = "3.6", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
