[package]
name = "vq-host-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ventriloquist desktop core: sessions, pairing, transcript store, Markdown log, transports"
publish = false

[features]
default = ["ble"]
# BLE transports: the btleplug central (macOS; Windows with
# VQ_BLE_MODE=central) and, on Windows, the WinRT GATT peripheral. On by default.
ble = ["dep:btleplug", "dep:futures", "dep:windows", "dep:windows-future"]
# TCP dev transport (desktop = client). Tests and the `vq-host` binary only;
# MUST NOT be enabled in release builds of the app.
dev-tcp = []

[[bin]]
name = "vq-host"
path = "src/bin/vq-host.rs"
required-features = ["dev-tcp"]

[dependencies]
vq-protocol = { path = "../../protocol" }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
dirs = "5.0.1"
gethostname = "1.1"
base64 = "0.22"
zeroize = "1.8"
rand = "0.8.5"
thiserror = "2.0"
log = "0.4"
btleplug = { version = "0.13", optional = true }
futures = { version = "0.3", optional = true }

# WinRT GATT server (transport::ble_peripheral); only built on Windows.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
] }
windows-future = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3.23"
tokio = { version = "1.45", features = ["process"] }
