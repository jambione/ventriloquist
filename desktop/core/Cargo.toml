[package]
name = "vq-host-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ventriloquist desktop core: sessions, pairing, transcript store, Markdown log, transports"
publish = false

[features]
default = ["relay"]
# The cloud relay transport (SPEC_V3): WebSocket + HTTPS long-poll fallback,
# TLS from the OS certificate store (native-tls: schannel / Security.framework),
# OS proxy settings including PAC. On by default.
relay = [
    "dep:tokio-tungstenite",
    "dep:native-tls",
    "dep:tokio-native-tls",
    "dep:reqwest",
    "dep:futures-util",
    "dep:core-foundation",
    "dep:core-foundation-sys",
    "dep:windows",
]
# TCP dev transport (desktop = client). Tests and the `vq-host` binary only;
# MUST NOT be enabled in release builds of the app.
dev-tcp = []

[[bin]]
name = "vq-host"
path = "src/bin/vq-host.rs"
required-features = ["dev-tcp"]

[dependencies]
vq-protocol = { path = "../../protocol" }
tokio = { version = "1.45", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
dirs = "5.0.1"
gethostname = "1.1"
base64 = "0.22"
zeroize = "1.8"
rand = "0.8.5"
thiserror = "2.0"
log = "0.4"
url = "2.5"
percent-encoding = "2.3"
sha2 = "0.10"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"], optional = true }
native-tls = { version = "0.2", optional = true }
tokio-native-tls = { version = "0.3", optional = true }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "blocking"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"], optional = true }

# macOS: CFNetworkCopySystemProxySettings / CFNetworkCopyProxiesForURL (PAC).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { version = "0.10", optional = true }
core-foundation-sys = { version = "0.8", optional = true }

# Windows: WinHttpGetIEProxyConfigForCurrentUser + WinHttpGetProxyForUrl.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", optional = true, features = [
    "Win32_Foundation",
    "Win32_Networking_WinHttp",
] }

[dev-dependencies]
tempfile = "3.23"
tokio-tungstenite = { version = "0.30", features = ["connect"] }
tokio = { version = "1.45", features = ["process"] }
axum = { version = "0.8", default-features = false, features = ["http1", "ws", "tokio", "json", "query"] }
