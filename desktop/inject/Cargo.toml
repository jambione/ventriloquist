[package]
name = "vq-inject"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ventriloquist desktop: bindings to text boxes in other apps (model, store, delivery planner, injectors)"
publish = false

[features]
# Local macOS integration test (TextEdit). Needs Accessibility for the test
# runner; run with `cargo test -p vq-inject --features mac-it -- --ignored`.
mac-it = []
# Windows integration test (Notepad). Needs an interactive desktop session; run
# with `cargo test -p vq-inject --features win-it -- --ignored --nocapture`.
win-it = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.23"
