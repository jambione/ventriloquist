[package]
name = "vq-inject"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ventriloquist desktop: bindings to text boxes in other apps (model, store, delivery planner, injectors)"
publish = false

[features]
# Local macOS integration test (TextEdit). Needs Accessibility for the test
# runner; run with `cargo test -p vq-inject --features mac-it -- --ignored`.
mac-it = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
log = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"

[dev-dependencies]
tempfile = "3.23"
