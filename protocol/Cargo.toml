[package]
name = "vq-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Ventriloquist wire protocol: messages, framing, envelope encryption, pairing"
publish = false

[dependencies]
x25519-dalek = { version = "2.0.1", features = ["static_secrets", "zeroize"] }
chacha20poly1305 = "0.10.1"
hkdf = "0.12.4"
hmac = "0.12.1"
sha2 = "0.10.8"
rand = "0.8.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = "2.0"
zeroize = "1.8"

[dev-dependencies]
hex = "0.4"
